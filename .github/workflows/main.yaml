name: SFTP deployment test

on:
  push:
    branches:
      - codex/sftp-test
  workflow_dispatch:
    inputs:
      authentication:
        description: SFTP authentication method to test
        type: choice
        options:
          - password
          - key
        default: password

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  call-build-site:
    uses: comic-git/comic_git_engine/.github/workflows/build_site.yaml@bbc590cab0665b43f18c3efaa22c7aafc3c587a0
    with:
      DEPLOY_TARGET: sftp
      OUTPUT_DIR: build
      SFTP_HOST: 34.182.0.21
      SFTP_REMOTE_DIR: /home/comicgit/sftp-test.cvilbrandt.com
      SFTP_HIDDEN_PATHS: .htaccess
      SFTP_EXCLUDE_PATHS: .well-known
    secrets:
      SFTP_USERNAME: ${{ secrets.SFTP_TEST_USERNAME }}
      SFTP_PASSWORD: ${{ inputs.authentication != 'key' && secrets.SFTP_TEST_PASSWORD || '' }}
      SFTP_PRIVATE_KEY: ${{ inputs.authentication == 'key' && secrets.SFTP_TEST_PRIVATE_KEY || '' }}
      SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_TEST_KNOWN_HOSTS }}
